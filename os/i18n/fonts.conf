<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  KorrinOS 55-language font resolution chain.

  Why this file exists: the OS default typeface is Balsamiq Sans, which carries
  Latin + Cyrillic glyphs ONLY. Measured coverage is 0 for Greek, Arabic,
  Hebrew, Devanagari, Bengali, Tamil, Telugu, Gujarati, Kannada, Malayalam,
  Gurmukhi, Sinhala, Thai, Lao, Ethiopic, Myanmar, CJK and Hangul.

  So Balsamiq cannot be the terminal's only font. This chain keeps Balsamiq as
  the preferred face for the scripts it actually covers, then falls through to
  a per-script monospace face. Monospace is mandatory, not cosmetic: a
  proportional fallback in a terminal destroys column alignment.

  Order matters. fontconfig takes the FIRST family that covers the glyph.
-->
<fontconfig>

  <!-- Default UI/terminal face. Latin + Cyrillic. -->
  <alias><family>monospace</family><prefer>
    <family>Balsamiq Sans</family>
  </prefer></alias>
  <alias><family>sans-serif</family><prefer>
    <family>Balsamiq Sans</family>
  </prefer></alias>
  <alias><family>sans</family><prefer>
    <family>Balsamiq Sans</family>
  </prefer></alias>

  <!--
    Per-script monospace fallbacks. Each entry only wins for glyphs Balsamiq
    lacks, because Balsamiq is listed first above.
  -->

  <!-- Arabic-script: Arabic, Persian, Urdu (all 3 are RTL) -->
  <alias><family>monospace</family><prefer>
    <family>Noto Sans Mono Arabic</family>
  </prefer></alias>
  <!-- Hebrew (RTL) -->
  <alias><family>monospace</family><prefer>
    <family>Noto Sans Mono Hebrew</family>
  </prefer></alias>

  <!-- Indic: Devanagari, Bengali, Tamil, Telugu, Gujarati, Kannada,
       Malayalam, Gurmukhi, Sinhala -->
  <alias><family>monospace</family><prefer>
    <family>Noto Sans Mono Devanagari</family>
    <family>Noto Sans Mono Bengali</family>
    <family>Noto Sans Mono Tamil</family>
    <family>Noto Sans Mono Telugu</family>
    <family>Noto Sans Mono Gujarati</family>
    <family>Noto Sans Mono Kannada</family>
    <family>Noto Sans Mono Malayalam</family>
    <family>Noto Sans Mono Gurmukhi</family>
    <family>Noto Sans Mono Sinhala</family>
  </prefer></alias>

  <!-- Southeast Asian: Thai, Lao, Myanmar, Khmer -->
  <alias><family>monospace</family><prefer>
    <family>Noto Sans Mono Thai</family>
    <family>Noto Sans Mono Lao</family>
    <family>Noto Sans Mono Myanmar</family>
  </prefer></alias>

  <!-- CJK + Hangul. Wide glyphs: callers must use a wcwidth table that
       reports 2 cells, or box drawing and column maths will misalign. -->
  <alias><family>monospace</family><prefer>
    <family>Noto Sans Mono CJK SC</family>
    <family>Noto Sans Mono CJK TC</family>
    <family>Noto Sans Mono CJK JP</family>
    <family>Noto Sans Mono CJK KR</family>
  </prefer></alias>

  <!-- Ethiopic (Amharic) and Greek -->
  <alias><family>monospace</family><prefer>
    <family>Noto Sans Mono Ethiopic</family>
    <family>Noto Sans Mono</family>
  </prefer></alias>

  <!-- Last-resort: never render tofu silently in a terminal. -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono</string>
    </edit>
  </match>

</fontconfig>
